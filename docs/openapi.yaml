  /api/a2a/tasks/history:
    get:
      operationId: getApiA2aTasksHistory
      tags: [A2a]
      summary: List persisted A2A task history
      description: >-
        Lists persisted task transitions, including tasks that have expired from the in-memory
        task manager. Valid API-key callers are owner-scoped; management callers see all tasks.
        Authentication follows the instance's REQUIRE_API_KEY and login policy.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: skill
          in: query
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          schema: { type: string, enum: [submitted, working, completed, failed, cancelled] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Persisted task page and total count
          content:
            application/json:
              schema:
                type: object
                required: [tasks, total, limit, offset]
                properties:
                  tasks:
                    type: array
                    items:
                      type: object
                      required: [id, state, skill, createdAt, updatedAt, completedAt]
                      properties:
                        id: { type: string }
                        state: { type: string, enum: [submitted, working, completed, failed, cancelled] }
                        skill: { type: [string, "null"] }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                        completedAt: { type: [string, "null"], format: date-time }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1, maximum: 500 }
                  offset: { type: integer, minimum: 0 }
        "400": { description: Invalid history query parameters }
        "401": { description: Authentication required when the instance policy requires it }
        "500": { description: Task history could not be read }

  /api/canary-drain:
    post:
      operationId: postApiCanaryDrain
      tags: [System]
      summary: Set this deployment generation's draining state
      description: >-
        Requires management authentication. The generation must match
        OMNIROUTE_APP_GENERATION; stale or foreign generations are rejected. This control route
        returns the current canary readiness document after changing the drain flag.
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, draining]
              properties:
                generation: { type: string, minLength: 1 }
                draining: { type: boolean }
      responses:
        "200":
          description: Updated readiness state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanaryReadiness" }
        "400": { description: Invalid control request }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }
        "409": { description: Deployment generation conflict }

  /api/canary-readiness:
    get:
      operationId: getApiCanaryReadiness
      tags: [System]
      summary: Read authenticated canary readiness
      description: >-
        Runs bounded database, coordination, conversation-state, and registered component probes.
        The response is 503 while any required readiness check is false.
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: All required readiness probes passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanaryReadiness" }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }
        "503":
          description: One or more bounded readiness probes did not pass
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanaryReadiness" }
    post:
      operationId: postApiCanaryReadiness
      tags: [System]
      summary: Acknowledge a peer conversation-state handoff
      description: >-
        Requires management authentication and a current peer challenge. The handler accepts only
        generation and peerChallengeId, and never trusts caller-supplied proof booleans or URLs.
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [generation, peerChallengeId]
              properties:
                generation: { type: string, pattern: "^[a-f0-9]{32}$" }
                peerChallengeId: { type: string, format: uuid }
      responses:
        "200":
          description: Peer handoff challenge completed
          content:
            application/json:
              schema:
                type: object
                required: [protocol, generation, peerGeneration, peerChallengeId, completed]
                properties:
                  protocol: { type: string, const: omni-conversation-state/v1 }
                  generation: { type: string }
                  peerGeneration: { type: string }
                  peerChallengeId: { type: string, format: uuid }
                  completed: { type: boolean, const: true }
        "400": { description: Invalid or duplicated handoff fields }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }
        "409": { description: Handoff generation, challenge, or shape mismatch }
        "413": { description: Handoff body exceeds 4096 bytes }
        "503": { description: Generation is not bootstrapped or handoff state is unavailable }

