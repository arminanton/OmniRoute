[package]
name = "omniroute-runtime-proxy-bench"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-stream = "0.3"
axum = "0.8.9"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
