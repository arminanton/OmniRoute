  /api/providers/{id}/browser-login/{action}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: action
        in: path
        required: true
        allowReserved: true
        x-nextjs-catch-all: true
        description: >-
          Catch-all suffix. POST accepts start, {session}/capture, {session}/cancel,
          {session}/status, and the bridge-only {session}/authorize. GET accepts
          {session}/view and {session}/assets/{assetPath}.
        schema: { type: string }
    get:
      operationId: getApiProvidersByIdBrowserLoginByAction
      tags: [Providers]
      summary: Read a provider browser-login view or asset
      description: Requires a same-origin dashboard session and a browser-login-enabled connection.
      security:
        - ManagementSessionAuth: []
      responses:
        "200":
          description: Browser-login HTML view or JavaScript asset
          content:
            text/html:
              schema: { type: string }
            text/javascript:
              schema: { type: string }
        "403": { description: Dashboard session or same-origin request required }
        "409": { description: Browser-login session or asset is unavailable }
    post:
      operationId: postApiProvidersByIdBrowserLoginByAction
      tags: [Providers]
      summary: Start or control provider browser login
      description: >-
        Requires a same-origin dashboard session. The JSON body must be an empty object. Start
        returns the new session ID and expiry; capture, cancel, and status actions return ok.
        Authorize is restricted to the configured WebSocket bridge secret.
      security:
        - ManagementSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
              additionalProperties: false
      responses:
        "200":
          description: Session-start, bridge-owner, or operation acknowledgement payload
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [id, expires]
                    properties:
                      id: { type: string }
                      expires: { type: number }
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
                  - type: object
                    required: [owner]
                    properties:
                      owner: { type: string }
        "403": { description: Dashboard session or same-origin request required }
        "409": { description: Connection, session, or requested action is unavailable }

  /api/usage/diagnostic-overflow:
    get:
      operationId: getApiUsageDiagnosticOverflow
      tags: [Usage]
      summary: List private diagnostic overflow traces
      description: >-
        Lists bounded metadata for private request/response captures. Payload bytes are available
        only through the authenticated download routes; trace ownership and capture state are
        checked before file access.
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Private trace manifests
          content:
            application/json:
              schema:
                type: object
                required: [traces]
                properties:
                  traces:
                    type: array
                    items: { $ref: "#/components/schemas/DiagnosticOverflowManifest" }
        "400": { description: Invalid pagination parameters }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }
        "503": { description: Diagnostic overflow store is unavailable }
    head:
      operationId: headApiUsageDiagnosticOverflow
      tags: [Usage]
      summary: Reject implicit HEAD access to private overflow data
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "405":
          description: HEAD is intentionally refused; use GET to list manifests
          headers:
            Allow: { schema: { type: string, const: GET } }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }

  /api/usage/diagnostic-overflow/{traceId}:
    parameters:
      - name: traceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getApiUsageDiagnosticOverflowByTraceId
      tags: [Usage]
      summary: Read one private diagnostic trace manifest
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Trace manifest without raw payload contents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiagnosticOverflowManifest" }
        "400": { description: Trace ID is not a UUID }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }
        "404": { description: Trace manifest not found }
        "503": { description: Diagnostic overflow store is unavailable }
    head:
      operationId: headApiUsageDiagnosticOverflowByTraceId
      tags: [Usage]
      summary: Reject implicit HEAD access to a private overflow manifest
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "405":
          description: HEAD is intentionally refused; use GET to inspect the trace
          headers:
            Allow: { schema: { type: string, const: GET } }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }

  /api/usage/diagnostic-overflow/{traceId}/client-request:
    parameters:
      - name: traceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getApiUsageDiagnosticOverflowByTraceIdClientRequest
      tags: [Usage]
      summary: Download the private client request capture
      description: Returns a gzip stream; response headers state whether capture completed fully.
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Gzip-compressed raw client request bytes
          headers:
            X-Diagnostic-Capture-State: { schema: { type: string, enum: [capturing, complete, incomplete] } }
            X-Diagnostic-Capture-Complete: { schema: { type: string, enum: ["true", "false"] } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { description: Trace ID is invalid }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }
        "404": { description: Client request capture not found }
        "409": { description: Client request capture is not ready or its file alias is invalid }
        "503": { description: Diagnostic overflow store is unavailable }
    head:
      operationId: headApiUsageDiagnosticOverflowByTraceIdClientRequest
      tags: [Usage]
      summary: Reject implicit HEAD access to a client request capture
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "405":
          description: HEAD is intentionally refused; use GET to download the capture
          headers:
            Allow: { schema: { type: string, const: GET } }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }

  /api/usage/diagnostic-overflow/{traceId}/{attemptId}/{kind}:
    parameters:
      - name: traceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: attemptId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [request, response, client-request] }
    get:
      operationId: getApiUsageDiagnosticOverflowByTraceIdByAttemptIdByKind
      tags: [Usage]
      summary: Download one private provider attempt capture
      description: Returns a gzip stream; response headers state whether capture completed fully.
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Gzip-compressed request or response capture
          headers:
            X-Diagnostic-Capture-State: { schema: { type: string, enum: [capturing, complete, incomplete] } }
            X-Diagnostic-Capture-Complete: { schema: { type: string, enum: ["true", "false"] } }
            Content-Disposition: { schema: { type: string } }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { description: Trace, attempt, or file alias is invalid }
        "401": { $ref: "#/components/responses/ManagementAuthenticationRequired" }
        "404": { description: Capture file not found }
        "409": { description: Capture is still being written or its alias is invalid }
        "503": { description: Diagnostic overflow store is unavailable }
    head:
      operationId: headApiUsageDiagnosticOverflowByTraceIdByAttemptIdByKind
      tags: [Usage]
      summary: Reject implicit HEAD access to a provider attempt capture
      security:
        - ManagementSessionAuth: []
        - BearerAuth: []
      responses:
        "405":
