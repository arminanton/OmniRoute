  /api/providers/health-autopilot:
    get:
      operationId: getApiProvidersHealthAutopilot
      tags:
        - Providers
      summary: Get provider health autopilot report
      description: >-
        Reports provider health issues and recommended guarded actions. includeHealthy defaults
        false; includeActions defaults true. Action requests require confirmation and a current
        preconditions hash when executing a state change.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      parameters:
        - name: provider
          in: query
          required: false
          schema: { type: string }
          description: Restrict the report to one provider.
        - name: includeHealthy
          in: query
          required: false
          schema: { type: string, default: "false" }
          description: "Set to true or 1 to include healthy providers; other supplied values are false."
        - name: includeActions
          in: query
          required: false
          schema: { type: string, default: "true" }
          description: "Set to true or 1 to include recommended actions; other supplied values are false."
      responses:
        "200":
          description: Provider health issues, scores, and recommended actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthAutopilotReport"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "500":
          description: Failed to build provider health autopilot report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/providers/health-autopilot/actions:
    post:
      operationId: postApiProvidersHealthAutopilotActions
      tags:
        - Providers
      summary: Execute a confirmed provider health-autopilot action
      description: >-
        Executes only an action currently present in the provider report. A stale
        preconditionsHash returns 409; state-changing actions require confirm=true. dryRun=true
        returns a preview without applying the change.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderHealthAutopilotActionRequest"
      x-always-protected: true
      responses:
        "200":
          description: Action preview or state change result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthAutopilotActionResponse"
        "400":
          description: Invalid action or explicit confirmation is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthAutopilotActionErrorResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "404":
          description: The action is no longer applicable to the latest report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthAutopilotActionErrorResponse"
        "409":
          description: Preconditions changed or the target is in a terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthAutopilotActionErrorResponse"
        "500":
          description: Failed to apply the provider health-autopilot action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /api/providers/health-matrix:
    get:
      operationId: getApiProvidersHealthMatrix
      tags:
        - Providers
      summary: Get the provider health matrix
      description: >-
        Returns provider, account, model, circuit-breaker, and web-session-pool health for the
        requested time range. Sensitive connection labels are masked before returning.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      parameters:
        - name: provider
          in: query
          required: false
          schema: { type: string, minLength: 1 }
          description: Restrict the report to one provider ID or alias.
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [1h, 24h, 7d, 30d], default: 24h }
        - name: includeHealthy
          in: query
          required: false
          schema: { type: string, enum: ["true", "false", "1", "0"], default: "true" }
      responses:
        "200":
          description: Provider health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderHealthMatrixResponse"
        "400":
          description: Invalid health matrix query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "500":
          description: Failed to build provider health matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
