openapi: 3.1.0
info:
  title: OmniRoute API
  version: 3.8.51
  description: |
    OmniRoute is a local-first AI API proxy router. It provides an OpenAI-compatible
    endpoint that routes requests to multiple AI providers with load balancing,
    failover, and usage tracking.

    ## Base URLs
    - **Local**: `http://localhost:20128`

    ## Authentication
    Authentication is route- and configuration-specific. Most inference/proxy endpoints
    use Bearer API keys. Model discovery can be anonymous when `requireAuthForModels`
    is disabled; when protected, it accepts a valid API key or dashboard session.
    Management endpoints use the mechanisms stated on each operation and may depend on
    `requireLogin`; some routes are also restricted to loopback access. Missing
    operation-level `security` metadata is not a promise that a route is anonymous.
  contact:
    name: OmniRoute
  license:
    name: MIT

servers:
  - url: http://localhost:20128
    description: Local development

