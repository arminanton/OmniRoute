      summary: Clean up database backups and save retention settings
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                keepLatest: { type: integer, minimum: 1, maximum: 200 }
                retentionDays: { type: integer, minimum: 0, maximum: 3650 }
              additionalProperties: false
      responses:
        "200":
          description: Backup cleanup and retention settings
        "400":
          description: Invalid retention settings
        "401":
          description: Authentication required

