# STAGED private override selected with CONTAINERS_CONF, not a host-global edit.
[containers]
# Rootful Podman still needs privileges to join namespaces. These defaults and
# explicit CLI options apply only to the OCI workload after that boundary.
default_capabilities = []
default_sysctls = []
devices = []
mounts = []
volumes = []
env = []
env_host = false
http_proxy = false
read_only = true
userns = "host"
umask = "0077"

[engine]
# The command also passes this explicitly. Never inherit host hook directories.
hooks_dir = ["/etc/omni-local-next/no-hooks"]
