  /api/provider-models:
    get:
      operationId: getApiProviderModels
      tags: [Providers]
      summary: List provider models
      description: >-
        With `provider`, returns that provider's custom model array and compatibility overrides.
        Without it, `models` is keyed by provider ID and `modelCompatOverrides` is empty. The
        hidden-model map includes hidden IDs for all providers.
      parameters:
        - name: provider
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Provider model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderModelsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Provider model list could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    post:
      operationId: postApiProviderModels
      tags: [Providers]
      summary: Add a custom provider model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, modelId]
              properties:
                provider: { type: string, minLength: 1 }
                modelId: { type: string, minLength: 1 }
                modelName: { type: string }
                source: { type: string }
                apiFormat: { type: string }
                supportedEndpoints: { type: array, items: { type: string } }
                targetFormat: { type: string }
                max_input_tokens: { type: integer, minimum: 1 }
                max_output_tokens: { type: integer, minimum: 1 }
              additionalProperties: true
      responses:
        "200":
          description: Custom provider model added or updated
        "400":
          description: Invalid provider model data
        "401":
          description: Authentication required
    put:
      operationId: putApiProviderModels
      tags: [Providers]
      summary: Replace or upsert a custom provider model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, modelId]
              properties:
                provider: { type: string, minLength: 1 }
                modelId: { type: string, minLength: 1 }
              additionalProperties: true
      responses:
        "200":
          description: Custom provider model saved
        "400":
          description: Invalid provider model data
        "401":
          description: Authentication required
    patch:
      operationId: patchApiProviderModels
      tags: [Providers]
      summary: Update custom models for one provider
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Provider custom models updated
        "400":
          description: Invalid provider or model data
        "401":
          description: Authentication required
    delete:
      operationId: deleteApiProviderModels
      tags: [Providers]
      summary: Delete custom provider models
      parameters:
        - name: provider
          in: query
          required: true
          schema: { type: string }
        - name: model
          in: query
          schema: { type: string }
        - name: all
          in: query
          schema: { type: boolean }
        - name: resetOverride
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Custom provider model removed
        "400":
          description: Provider query parameter is missing
        "401":
          description: Authentication required

  /api/keys:
    get:
      operationId: getApiKeys
      tags: [API Keys]
      summary: List API keys
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyListResponse"
        "401":
          description: Authentication required
    post:
      operationId: postApiKeys
      tags: [API Keys]
      summary: Create API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                modelAccessMode:
                  type: string
                  enum: [all, restricted]
                allowedModels:
                  type: array
                  maxItems: 1000
                  items: { type: string, minLength: 1 }
                allowedCombos:
                  type: array
                  maxItems: 500
                  items: { type: string, minLength: 1, maxLength: 200 }
                noLog: { type: boolean }
                allowUsageCommand: { type: boolean }
                usageLimitEnabled: { type: boolean }
                dailyUsageLimitUsd: { type: [number, "null"], minimum: 0 }
                weeklyUsageLimitUsd: { type: [number, "null"], minimum: 0 }
                chaosModeEnabled: { type: boolean }
                scopes:
                  type: array
                  maxItems: 32
                  items: { type: string, minLength: 1, maxLength: 64 }
                allowedConnections:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Created API key (includes full key value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreateResponse"
        "401":
          description: Authentication required

