                $ref: "#/components/schemas/ProviderBatchTestResponse"
        "400":
          description: Invalid JSON or batch-test parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "500":
          description: Batch test failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/providers/validate:
    post:
      operationId: postApiProvidersValidate
      tags: [Providers]
      summary: Validate provider credentials
      description: >-
        Performs a provider-specific credential probe. Successful HTTP responses may still have
        valid=false. Provider HTTP failures preserve their status code and return a sanitized error.
        Supplying cx is required when provider is google-pse-search.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderValidationRequest"
      responses:
        "200":
          description: Provider validation result; valid=false is a normal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationResponse"
        "400":
          description: Invalid request or validation is not supported for this provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationErrorResponse"
        "401":
          description: Management authentication failed or provider rejected credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationErrorResponse"
        "403":
          description: Management credential lacks scope or provider denied validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationErrorResponse"
        "404":
          description: Compatible provider node not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationErrorResponse"
        "500":
          description: Provider validation failed unexpectedly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationErrorResponse"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationErrorResponse"
        default:
          description: Provider validation returned another provider-specific failure status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderValidationErrorResponse"

  /api/providers/client:
    get:
      operationId: getApiProvidersClient
      tags: [Providers]
      summary: List safe provider metadata for dashboard widgets
      description: >-
        Returns connection metadata for dashboard client widgets. Primary API keys are masked,
        OAuth tokens are omitted, and provider-specific credential fields are sanitized. Management
        authentication is enforced when enabled by the deployment configuration; scoped Bearer
