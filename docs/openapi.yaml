            required: [content]
            properties:
              role: { type: string }
              content:
                oneOf:
                  - type: string
                  - type: array
                    minItems: 1
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        text: { type: string }
                      additionalProperties: true
            additionalProperties: true
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  type: { type: string }
                  text: { type: string }
                additionalProperties: true
      additionalProperties: true

    CountTokensResponse:
      type: object
      required: [input_tokens, source]
      properties:
        input_tokens: { type: integer, minimum: 0 }
        model: { type: string }
        provider: { type: string }
        source:
          type: string
          enum: [local, provider]
      additionalProperties: true

    ResponsesRequest:
      type: object
      description: OpenAI Responses-compatible input with provider-specific fields passed through.
      properties:
        model: { type: string }
        input:
          oneOf:
            - type: string
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: object
                    additionalProperties: true
        instructions:
          oneOf:
            - type: string
            - type: array
              items: { type: object, additionalProperties: true }
        previous_response_id: { type: string }
        stream: { type: boolean }
        max_output_tokens: { type: integer, minimum: 1 }
        temperature: { type: number }
        top_p: { type: number }
        tools:
          type: array
          items: { type: object, additionalProperties: true }
        tool_choice:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        reasoning:
          type: object
          additionalProperties: true
        text:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
      additionalProperties: true

    ResponsesResponse:
