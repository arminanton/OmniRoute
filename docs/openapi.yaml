  /api/conversations:
    get:
      operationId: getApiConversations
      tags: [Conversations]
      summary: List multi-turn conversations
      description: >-
        Returns management-visible conversations that contain at least two turn nodes, with fresh
        request-activity and continuation annotations. `apiKeyId` is included for management
        clients; internal artifact paths and the last-call key ID are omitted.
      parameters:
        - name: limit
          in: query
          description: Maximum number of conversation rows to return.
          schema: { type: number, default: 50 }
        - name: offset
          in: query
          description: Number of conversation rows to skip.
          schema: { type: number, default: 0 }
      responses:
        "200":
          description: Conversation rows and total number of matching conversations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          description: Management credential is invalid or lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Conversation list could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
  /api/conversations/{id}/tree:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getApiConversationsByIdTree
      tags: [Conversations]
      summary: Get a chronological page of conversation turns
      description: >-
        Returns a flat chronological page, not a branching tree. Display text, tool-use/result
        kind, and tool name are resolved from the associated call-log artifact when available;
        turns whose artifacts are missing return an empty text preview. With `afterSeq`, all newer
        rows are returned without a page cap; otherwise `limit` is capped at 500 and `hasMore`
        indicates older rows remain.
      parameters:
        - name: limit
          in: query
          description: Page size, clamped by the server to the range 1–500 (default 20).
          schema: { type: number, default: 20, minimum: 1, maximum: 500 }
        - name: beforeSeq
          in: query
          description: Return the page immediately before this sequence number.
          schema: { type: number }
        - name: afterSeq
          in: query
          description: Return every turn with a greater sequence number; this polling mode is uncapped.
          schema: { type: number }
      responses:
        "200":
          description: Chronological page of conversation turns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationTurnPage"
        "400":
          description: Conversation ID is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          description: Management credential is invalid or lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Conversation turns could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
