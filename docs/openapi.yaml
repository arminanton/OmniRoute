        the local authentication configuration.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Provider connection details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionEnvelope"
        "404":
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "500":
          description: Failed to fetch provider connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    patch:
      operationId: patchApiProvidersById
      tags: [Providers]
      summary: Update provider connection
      description: >-
        Partial update using the same field semantics as PUT. Management authentication is
        enforced when enabled by the local authentication configuration.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionUpdate"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionEnvelope"
        "400":
          description: Invalid JSON, update fields, or provider-specific credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "404":
          description: Provider connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "500":
          description: Failed to update provider connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
    put:
      operationId: putApiProvidersById
      tags: [Providers]
      summary: Update a provider connection
      description: >-
        Applies the same partial-update semantics as PATCH; omitted fields are preserved.
        Management authentication is enforced when enabled by the local authentication
        configuration.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderConnectionUpdate"
      responses:
        "200":
          description: Provider connection updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionEnvelope"
        "400":
          description: Invalid provider connection data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "404":
          description: Provider connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnectionErrorResponse"
        "500":
          description: Failed to update provider connection
          content:
