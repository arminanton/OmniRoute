  /api/providers/test-batch:
    post:
      operationId: postApiProvidersTestBatch
      tags: [Providers]
      summary: Test multiple providers at once
      description: >-
        Tests matching connections in batches of at most five concurrent probes. The selected mode
        may include inactive connections only when explicit connection IDs are provided.
      security:
