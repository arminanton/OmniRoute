        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "500":
          description: Failed to fetch providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
        "503":
          description: Management authentication service is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

