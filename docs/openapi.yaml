components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Two bearer families are accepted. Inference API keys (typically `sk-…`)
        authorize `/v1/*`. Management routes also accept `oma_live_…` Access Tokens
        (Settings → Access Tokens / `omniroute connect`) and API keys whose metadata
        includes `manage` or `admin` scope. See docs/guides/MANAGEMENT-AUTH.md.
        Bearer credentials are accepted on management routes that use this scheme;
        they are not rejected solely for being Bearer.
    ManagementSessionAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: Dashboard management session cookie (auth_token) for protected management routes. Distinct from Bearer Access Tokens and API keys. See docs/guides/MANAGEMENT-AUTH.md.
    ClientApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Client API key header accepted by the client API auth policy.
    GoogleApiKeyAuth:
      type: apiKey
      in: header
      name: x-goog-api-key
      description: Google client SDK API key header accepted by the client API auth policy.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized
    ManagementAuthenticationRequired:
      description: Authentication required for management routes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              message: Authentication required
              type: invalid_request
            requestId: 3f9f6f5a-509a-4b35-b0a7-2d2d99d73a01
    ManagementInvalidToken:
      description: Management credential is invalid or lacks the required management scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              message: Invalid management token
              type: invalid_request
            requestId: 1b6a6ff8-d60c-4900-8d0a-25f81749f0a3
    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              message: Invalid request
              type: invalid_request_error
            requestId: 8c2b1d44-7a3e-4c91-9b0f-1e2d3c4b5a60
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              message: Resource not found
              type: not_found_error
            requestId: 4d5e6f70-1a2b-3c4d-5e6f-7a8b9c0d1e2f
    InternalError:
      description: An unexpected server error occurred
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
          example:
            error:
              message: Internal server error
              type: api_error
            requestId: 0a1b2c3d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
    ServiceUnavailable:
      description: >-
        Service unavailable because a local resource-pressure/admission guard rejected
        the request or the selected upstream is unavailable. Local pressure responses
        use an error.code of `resource_pressure` and include Retry-After; they include
        x-request-id when a correlation ID is available. Other errors may use a different
        machine-readable code.
      headers:
        Retry-After:
          schema: { type: string }
          description: Minimum delay before retrying, in seconds.
        x-request-id:
          schema: { type: string }
          description: Correlation ID for this rejected request when available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"

  schemas:
    CanaryReadiness:
      type: object
      required: [schema, generation, ready, databaseReady, coordination, conversationState, lifecycle]
      properties:
        schema: { type: string, const: omni-canary-readiness/v1 }
        generation: { type: string, description: Active OMNIROUTE_APP_GENERATION; empty before bootstrap. }
        ready: { type: boolean }
        databaseReady: { type: boolean }
        coordination:
          type: object
          required: [protocol, accountAdmission, refreshOwnership, backgroundOwnership, conversationState]
          properties:
            protocol: { type: string, const: omni-coordination/v1 }
            accountAdmission: { type: boolean }
            refreshOwnership: { type: boolean }
            backgroundOwnership: { type: boolean }
            conversationState: { type: boolean }
        conversationState:
          type: object
          required: [protocol, ready, challengeId, expiresAt, peerGeneration, handoffFresh, reason]
          properties:
            protocol: { type: string, const: omni-conversation-state/v1 }
            ready: { type: boolean }
            challengeId: { type: [string, "null"], format: uuid }
            expiresAt: { type: [integer, "null"], description: Unix epoch milliseconds. }
            peerGeneration: { type: [string, "null"] }
            handoffFresh: { type: boolean }
            reason: { type: [string, "null"] }
        lifecycle:
          type: object
          required: [activeResponses, activeWebSockets, pendingUploads, queuedRequests, conversationPins, upstreamLeases, diagnosticCaptureWork, draining]
          properties:
            activeResponses: { type: [integer, "null"], minimum: 0 }
            activeWebSockets: { type: [integer, "null"], minimum: 0 }
            pendingUploads: { type: [integer, "null"], minimum: 0 }
            queuedRequests: { type: [integer, "null"], minimum: 0 }
            conversationPins: { type: [integer, "null"], minimum: 0 }
            upstreamLeases: { type: [integer, "null"], minimum: 0 }
            diagnosticCaptureWork: { type: [integer, "null"], minimum: 0 }
            draining: { type: boolean }
    DiagnosticOverflowFile:
      type: object
      required: [state, complete, rawBytes, compressedBytes]
      properties:
        representation:
          type: string
          enum: [parsed_json_reserialized_utf8, serialized_provider_request_utf8, decoded_upstream_bytes]
        state: { type: string, enum: [capturing, complete, incomplete] }
        complete: { type: boolean }
        reason: { type: string }
        rawBytes: { type: integer, minimum: 0 }
        compressedBytes: { type: integer, minimum: 0 }
        sha256: { type: string }
        gzipSha256: { type: string }
    DiagnosticOverflowManifest:
      type: object
      required: [schema, traceId, provider, createdAt, state, reasons, attempts]
      properties:
        schema: { type: string, const: omni-diagnostic-overflow/v1 }
        traceId: { type: string, format: uuid }
        requestId: { type: string }
        provider: { type: string }
        createdAt: { type: integer, description: Unix epoch milliseconds. }
        sealedAt: { type: integer, description: Unix epoch milliseconds. }
        state: { type: string, enum: [capturing, complete, incomplete] }
        reasons:
          type: array
          items: { type: string }
        clientRequest:
          $ref: "#/components/schemas/DiagnosticOverflowFile"
        attempts:
          type: array
          items:
            type: object
            required: [attemptId, headers, request, response]
            properties:
              attemptId: { type: string, format: uuid }
              transport: { type: string }
              method: { type: string }
              url: { type: string, format: uri }
              status: { type: integer }
              headers:
                type: object
                additionalProperties: { type: string }
              request:
                $ref: "#/components/schemas/DiagnosticOverflowFile"
              response:
                $ref: "#/components/schemas/DiagnosticOverflowFile"
    ExclusiveConnectionLeaseLifecycle:
      type: object
      description: >-
        Shared lease lifecycle response. The optional connection object is present only for an
        explicit, successful owner-authenticated status action; acquire, renew, and release never
        include connection metadata.
      required: [state, generation, acquiredAt, renewedAt, expiresAt]
      properties:
        state: { type: string, enum: [ACTIVE, RELEASED] }
        generation: { type: integer, minimum: 1 }
        acquiredAt: { type: string, format: date-time }
        renewedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        connection:
          type: object
          description: >-
            Privacy-safe metadata for the exact active binding. Wrong-key, wrong-owner,
            stale-generation, missing, expired, released, or invalidated leases return a generic
            409 without this object. No credential, internal id, owner identity, or email fallback
            is serialized.
          required: [displayName, provider]
          properties:
            displayName:
              type: [string, "null"]
              description: Trimmed operator-configured name, or null when no privacy-safe name exists.
            provider:
              type: string
              minLength: 1
              description: Non-sensitive provider display label, never a generated compatible-provider id.
    ExclusiveConnectionLeaseCapacity:
      type: object
      required: [state, error, reason, retryAfter, eligibleCount, freeCount]
      properties:
        state: { type: string, const: WAITING_FOR_CAPACITY }
        error:
          type: object
          required: [type, code, message]
          properties:
            type: { type: string, const: lease_error }
            code: { type: string, const: LEASE_CAPACITY_UNAVAILABLE }
            message: { type: string }
        reason: { type: string, const: NO_FREE_ELIGIBLE_CONNECTION }
        retryAfter: { type: integer, minimum: 1, maximum: 3600 }
        eligibleCount: { type: integer, minimum: 0 }
        freeCount: { type: integer, minimum: 0 }
    EmbeddingMultimodalItem:
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              const: text
            text:
              type: string
              minLength: 1
        - type: object
          required: [type, source]
          properties:
            type:
              type: string
              enum: [image, audio, video, document]
            source:
              oneOf:
                - type: object
                  required: [type, url]
                  properties:
                    type:
                      type: string
                      const: url
                    url:
                      type: string
                      format: uri
                      description: Public HTTPS URL.
                - type: object
                  required: [type, data, media_type]
                  properties:
                    type:
                      type: string
                      const: base64
                    data:
                      type: string
                      format: byte
                    media_type:
                      type: string
      description: Provider-neutral structured embedding input item.

    PlaygroundPreset:
      type: object
      required:
        - id
        - name
        - endpoint
        - model
        - params
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        endpoint:
          type: string
          description: Playground endpoint key (e.g. "chat.completions")
        model:
          type: string
        system:
          type: string
          nullable: true
        params:
          type: object
          additionalProperties: true
          description: Serialized parameter values (temperature, max_tokens, etc.)
        created_at:
          type: string
          format: date-time
    PlaygroundPresetCreate:
      type: object
      required:
        - name
        - endpoint
        - model
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        endpoint:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
        system:
          type: string
          nullable: true
        params:
          type: object
          additionalProperties: true
          default: {}
    MemoryEntry:
      type: object
      description: A single persisted memory entry
      properties:
        id:
          type: string
          description: UUID
        apiKeyId:
          type: string
        sessionId:
          type: string
          nullable: true
        type:
          type: string
          enum:
            - factual
            - episodic
            - procedural
            - semantic
        key:
          type: string
          description: Stable upsert key (e.g. preference:i_prefer_python)
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        needsReindex:
          type: integer
          description: 1 if the vector for this memory is stale or missing
    MemorySettingsExtended:
      type: object
      description: Extended memory settings including 7 new fields from plan 21. All fields are optional for PUT (patch semantics).
      properties:
        enabled:
          type: boolean
        maxTokens:
          type: integer
          minimum: 0
          maximum: 16000
        retentionDays:
          type: integer
          minimum: 1
          maximum: 365
        strategy:
          type: string
          enum:
            - recent
            - semantic
            - hybrid
        skillsEnabled:
          type: boolean
        embeddingSource:
          type: string
          enum:
            - remote
            - static
            - transformers
            - auto
          description: Which embedding source to use. "auto" = remote > static > transformers.
        embeddingProviderModel:
          type: string
          nullable: true
          description: Embedding provider/model in "provider/model" format (e.g. openai/text-embedding-3-small).
        transformersEnabled:
          type: boolean
          description: Opt-in for Transformers.js local MiniLM model (~400MB RAM)
        staticEnabled:
          type: boolean
          description: Opt-in for static potion-base-8M local model
        rerankEnabled:
          type: boolean
          description: Enable reranking step (+200-500ms/req)
        rerankProviderModel:
          type: string
          nullable: true
          description: Rerank provider/model in "provider/model" format
        vectorStore:
          type: string
          enum:
            - sqlite-vec
            - qdrant
            - auto
          description: Which vector backend to use
    QdrantSettings:
      type: object
      description: Qdrant vector database configuration (read shape — no raw apiKey)
      properties:
        enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        collection:
          type: string
        embeddingModel:
          type: string
        hasApiKey:
          type: boolean
        apiKeyMasked:
          type: string
          nullable: true
          description: First 4 chars of the configured API key, or null
    QdrantHealthResult:
      type: object
      description: Result of a Qdrant liveness probe
      properties:
        ok:
          type: boolean
        latencyMs:
          type: number
        error:
          type: string
          nullable: true
          description: Sanitized error message (no stack traces)
    AgentSkill:
      type: object
      description: >-
        Single entry in the Agent Skills catalog. Describes one OmniRoute REST API surface
        (category: api) or CLI subcommand group (category: cli) with a canonical ID and a
        link to its SKILL.md documentation file.
      required: [id, name, description, category, area, rawUrl, githubUrl]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          description: Canonical skill ID (e.g. "omni-providers", "cli-serve")
          example: omni-providers
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Human-readable skill name
          example: Provider Management
        description:
          type: string
          minLength: 1
          maxLength: 2000
          description: One-paragraph description of what the skill covers
        category:
          type: string
          enum: [api, cli]
          description: "api = REST API skill; cli = CLI subcommand skill"
        area:
          type: string
          minLength: 1
          maxLength: 50
          description: Functional area slug (e.g. "providers", "combos-routing", "cli-serve")
          example: providers
        endpoints:
          type: array
          items:
            type: string
          description: REST API endpoints (present for api-category skills only)
          example: ["POST /api/providers", "GET /api/providers/:id"]
        cliCommands:
          type: array
          items:
            type: string
          description: CLI subcommand names (present for cli-category skills only)
          example: ["providers list", "providers test", "providers rotate"]
        icon:
          type: string
          description: Material symbol icon name for dashboard display
        isEntry:
          type: boolean
          description: Whether this is a recommended starting point
        isNew:
          type: boolean
          description: Whether this skill was added in a recent release
        rawUrl:
          type: string
          format: uri
          description: GitHub raw URL of the SKILL.md file
          example: "https://raw.githubusercontent.com/diegosouzapw/OmniRoute/refs/heads/main/skills/omni-providers/SKILL.md"
        githubUrl:
          type: string
          format: uri
          description: GitHub blob URL for viewing the SKILL.md in the browser
          example: "https://github.com/diegosouzapw/OmniRoute/blob/main/skills/omni-providers/SKILL.md"

    SkillCoverage:
      type: object
      description: >-
        Coverage statistics for the Agent Skills catalog: how many of the 22 REST API
        skills and 20 CLI skills have generated SKILL.md files on the local filesystem.
      required: [api, cli, totalSkills, generatedAt]
      properties:
        api:
          type: object
          required: [have, total]
          properties:
            have:
              type: integer
              minimum: 0
              maximum: 22
              description: Number of API skills with SKILL.md on disk
            total:
              type: integer
              enum: [22]
              description: Canonical API skill count (always 22)
        cli:
          type: object
          required: [have, total]
          properties:
            have:
              type: integer
              minimum: 0
              maximum: 20
              description: Number of CLI skills with SKILL.md on disk
            total:
              type: integer
              enum: [20]
              description: Canonical CLI skill count (always 20)
        totalSkills:
          type: integer
          minimum: 0
          maximum: 42
          description: Sum of api.have + cli.have
        generatedAt:
          type: string
          format: date-time
          description: ISO datetime when coverage was last computed

    ErrorResponse:
      type: object
      description: Standard error response body
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              description: Human-readable error message (never includes stack traces)
            code:
              type: string
              description: Machine-readable error code

    # ─── AgentBridge Schemas ────────────────────────────────────────

    AgentId:
      type: string
      enum:
        - antigravity
        - kiro
        - copilot
        - codex
        - cursor
        - zed
        - claude-code
        - open-code
        - trae
      description: One of the 9 supported IDE agents

    AgentBridgeAgentState:
      type: object
      description: Per-agent MITM state
      properties:
        agent_id:
          $ref: "#/components/schemas/AgentId"
        dns_enabled:
          type: boolean
        cert_trusted:
          type: boolean
        setup_completed:
          type: boolean
        last_started_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true

    AgentBridgeServerState:
      type: object
      description: Global AgentBridge MITM server state
      properties:
        running:
          type: boolean
        port:
          type: integer
          example: 443
        certReady:
          type: boolean
        interceptedCount:
          type: integer
        activeConnections:
          type: integer
        lastStartedAt:
          type: string
          format: date-time
          nullable: true

    AgentBridgeServerAction:
