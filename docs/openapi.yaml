        "400":
          $ref: "#/components/responses/BadRequest"

  /api/usage/cache-health:
    get:
      operationId: getApiUsageCacheHealth
      tags: [Usage]
      summary: Get prompt-cache health summary
      description: |
        Summarizes the `write/read` cache ratio from `call_logs` for a time window:
        distribution (p50/p90/p99/max of cache-write tokens), warm/cold/rewrite/uncached
        call counts, the "heavy write" outlier share (10x the window median, floored at
        1024 tokens — Anthropic's cache-creation minimum), and a per-model breakdown.
        Only successful (`status = 200`) calls with a non-null cache column are counted.
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d]
            default: 24h
        - name: model
          in: query
          description: Filter to one model or requested-model alias (1-200 chars).
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Cache health summary for the requested window
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalCalls:
                    type: integer
                  cacheReadTotal:
                    type: integer
                  cacheWriteTotal:
                    type: integer
                  writeReadRatio:
                    type: number
                  warmCalls:
                    type: integer
                  coldCalls:
                    type: integer
                  rewriteCalls:
                    type: integer
                  uncachedCalls:
                    type: integer
                  writeP50:
                    type: integer
                  writeP90:
                    type: integer
                  writeP99:
                    type: integer
                  writeMax:
                    type: integer
                  heavyWriteCalls:
                    type: integer
                  heavyWriteCallShare:
                    type: number
                  heavyWriteTokenShare:
                    type: number
                  heavyWriteThreshold:
                    type: integer
                  verdict:
                    type: string
                    enum: [healthy, degraded, thrash, no-data]
                  byModel:
                    type: array
                    items:
                      type: object
                      properties:
                        model:
                          type: string
                        calls:
                          type: integer
                        cacheReadTotal:
                          type: integer
                        cacheWriteTotal:
                          type: integer
                        writeReadRatio:
                          type: number
                        heavyWriteCalls:
                          type: integer
                  timeRange:
                    type: string
                  since:
                    type: string
                    format: date-time
                  truncated:
                    type: boolean
                    description: True when the window held more than 5000 rows and only the newest were summarized.
        "400":
          description: Invalid query parameters

  /api/usage/model-latency-stats:
    get:
      operationId: getApiUsageModelLatencyStats
      tags: [Usage]
      summary: Get per-model/provider latency statistics
      description: >-
        Aggregates `usage_history` rows into per-(provider, model) latency stats
        (avg/p50/p95/p99, std-dev, TTFT, tokens/sec) over a rolling window. Falls
        back from successful-only to all-sample rows when the successful count is
        below `minSamples`.
      security:
        - ManagementSessionAuth: []
      parameters:
        - name: windowHours
          in: query
          schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
            maximum: 720
            default: 24
        - name: minSamples
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: maxRows
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50000
            default: 10000
        - name: provider
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: model
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        "200":
          description: Latency stats keyed by provider/model, plus the window used
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        provider:
                          type: string
                        model:
                          type: string
                        key:
                          type: string
                        totalRequests:
                          type: integer
                        successfulRequests:
                          type: integer
                        successRate:
                          type: number
                        avgLatencyMs:
                          type: number
                        p50LatencyMs:
                          type: number
                        p95LatencyMs:
                          type: number
                        p99LatencyMs:
                          type: number
                        latencyStdDev:
                          type: number
                        windowHours:
                          type: number
                        avgTtftMs:
                          type: number
                        avgE2ELatencyMs:
                          type: number
                        avgTokensPerSecond:
                          type: number
                  windowHours:
                    type: number
                  generatedAt:
                    type: string
                    format: date-time
        "400":
          description: Invalid query parameters
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"

