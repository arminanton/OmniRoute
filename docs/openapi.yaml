        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        model: { type: string }
        content:
          type: array
          items:
            type: object
            description: Text, tool-use, thinking, or provider-specific output block.
            properties:
              type: { type: string }
              text: { type: string }
              id: { type: string }
              name: { type: string }
              input: {}
              thinking: { type: string }
            additionalProperties: true
        stop_reason:
          oneOf:
            - type: string
            - type: "null"
        stop_sequence:
          oneOf:
            - type: string
            - type: "null"
        usage:
          type: object
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            cache_creation_input_tokens: { type: integer, minimum: 0 }
            cache_read_input_tokens: { type: integer, minimum: 0 }
          additionalProperties: true
      additionalProperties: true

    CountTokensRequest:
      type: object
      required: [messages]
      properties:
