# ──────────────────────────────────────────────────────────────────────
#  omni.vm.local  ->  OmniRoute (rootless podman container on 127.0.0.1:20128)
#
#  Mirrors the box convention (hermes.vm.local / new-dash.vm.local):
#    - :80  redirects to HTTPS
#    - :443 terminates TLS with the shared *.vm.local self-signed cert
#      (conf.d/devvm.cert.pem, SAN DNS:*.vm.local) and reverse-proxies to
#      the container's published loopback port.
#
#  LOCALHOST-ORIGIN REQUIREMENT: every upstream request is rewritten so the
#  app sees it as coming from 127.0.0.1:20128, NOT the external IP / the
#  omni.vm.local hostname:
#    - Host + Origin  = 127.0.0.1:20128  (what a direct localhost hit sends)
#    - X-Real-IP / X-Forwarded-For = 127.0.0.1
#  OmniRoute builds all its client URLs from window.location at runtime, so
#  the browser still talks to https://omni.vm.local while the SERVER handles
#  the request identically to http://localhost:20128. No sub_filter needed.
#
#  AUTH: OmniRoute has its OWN login (INITIAL_PASSWORD + auth_token cookie +
#  HMAC CSRF bound to that cookie, not to Origin/Host). So unlike the Hermes
#  dashboard, NO nginx-level token gate is added here; the app authenticates.
#  X-Forwarded-Proto https makes OmniRoute set Secure cookies correctly.
#
#  WebSocket (live dashboard on the same origin) is upgraded through /.
# ──────────────────────────────────────────────────────────────────────
map $http_upgrade $omni_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP :80 -> redirect to HTTPS
server {
    listen      80;
    server_name omni.vm.local;
    return      301 https://$host$request_uri;
}

# HTTPS :443 -> reverse proxy to the OmniRoute container
server {
    listen 443 ssl;
    http2 on;
    server_name omni.vm.local;

    ssl_certificate     conf.d/devvm.cert.pem;
    ssl_certificate_key conf.d/devvm.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/omni-access.log main;
    error_log  /var/log/nginx/omni-error.log;

    # Large model responses / SSE streams: don't buffer, keep long timeouts.
    proxy_buffering off;
    client_max_body_size 100m;

    location / {
        proxy_pass         http://127.0.0.1:20128;
        proxy_http_version 1.1;

        # Present the request to OmniRoute as if it came from localhost.
        proxy_set_header Host              127.0.0.1:20128;
        proxy_set_header Origin            http://127.0.0.1:20128;
        proxy_set_header X-Real-IP         127.0.0.1;
        proxy_set_header X-Forwarded-For   127.0.0.1;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket upgrade (live dashboard).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $omni_connection_upgrade;

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
