      description: >-
        Proxies `GET https://api.elevenlabs.io/v1/voices` using the stored
        `elevenlabs` provider credentials (the caller never sends `xi-api-key`).
        The incoming query string is forwarded unchanged. Authentication is
        required when REQUIRE_API_KEY is enabled; otherwise anonymous requests are accepted.
