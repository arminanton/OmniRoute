      summary: Rerank documents
      description: >-
        Document reranking endpoint with Cohere-compatible results. Authentication
        is required when REQUIRE_API_KEY is enabled; otherwise anonymous requests are
        accepted.
      security:
        - BearerAuth: []
        - ClientApiKeyAuth: []
        - GoogleApiKeyAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, query, documents]
              properties:
                model:
                  type: string
                query:
                  type: string
                documents:
                  type: array
                  items:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          text: { type: string }
                        additionalProperties: true
