      description: >-
        Creates an edited image using a provider-specific image-edit flow.
        Authentication is required when REQUIRE_API_KEY is enabled; otherwise
        anonymous requests are accepted.
      security:
        - BearerAuth: []
        - ClientApiKeyAuth: []
        - GoogleApiKeyAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, model]
              properties:
                prompt: { type: string }
                model: { type: string }
                size: { type: string }
                response_format: { type: string, enum: [url, b64_json] }
                image: {}
                image_url:
                  oneOf:
                    - type: string
                    - type: object
                      additionalProperties: true
                images:
                  type: array
                  items: {}
              anyOf:
                - required: [image]
                - required: [image_url]
                - required: [images]
              additionalProperties: true
          multipart/form-data:
            schema:
              type: object
              required: [prompt, model]
              properties:
                prompt: { type: string }
                model: { type: string }
                size: { type: string }
                response_format: { type: string, enum: [url, b64_json] }
                image:
                  type: string
                  format: binary
                image[]:
                  type: array
                  items: { type: string, format: binary }
              anyOf:
                - required: [image]
                - required: ["image[]"]
              additionalProperties: true
      responses:
        "200":
          description: Edited image result.
          content:
            application/json:
              schema:
