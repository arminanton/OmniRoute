              properties:
                rpm: { type: integer, minimum: 0, maximum: 1000000 }
                rpd: { type: integer, minimum: 0, maximum: 10000000 }
                tpm: { type: integer, minimum: 0, maximum: 100000000 }
                tpd: { type: integer, minimum: 0, maximum: 10000000000 }
                minTime: { type: integer, minimum: 0, maximum: 60000 }
                maxConcurrent: { type: integer, minimum: 0, maximum: 10000 }
