  # ─── Proxy Subscriptions ───────────────────────────────────────

  /api/v1/management/proxy-subscriptions:
    get:
      operationId: getApiV1ManagementProxySubscriptions
      tags: [Proxy Subscriptions]
      summary: List proxy subscriptions
      description: >-
        Lists all operator-supplied proxy subscription links. Also starts the
        background auto-refresh scheduler (idempotent) so enabled subscriptions
        stay in sync. Credentials embedded in `url` are redacted in the response.
      security:
        - ManagementSessionAuth: []
      responses:
        "200":
          description: Subscription list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProxySubscription"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
    post:
      operationId: postApiV1ManagementProxySubscriptions
      tags: [Proxy Subscriptions]
      summary: Create a proxy subscription
      description: >-
        Creates a subscription record. If `mode` is `rule`, at least one entry in
        `ruleProviders` is required. `updateIntervalMinutes` defaults to 60 and
        `enabled` defaults to `false` when omitted or not exactly `true`.
      security:
        - ManagementSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, url]
              properties:
                name:
                  type: string
                  minLength: 1
                url:
                  type: string
                  minLength: 1
                mode:
                  type: string
                  enum: [global, rule]
                  default: global
                ruleProviders:
                  type: array
                  items:
                    type: string
                  description: Required (non-empty) when mode is "rule".
                localCoreEndpoint:
                  type: string
                  nullable: true
                updateIntervalMinutes:
                  type: integer
                  default: 60
                enabled:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Created subscription (url redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxySubscription"
        "400":
          description: Missing name/url, or ruleProviders empty while mode is "rule"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"

  /api/v1/management/proxy-subscriptions/{id}:
    get:
      operationId: getApiV1ManagementProxySubscriptionsById
      tags: [Proxy Subscriptions]
      summary: Get a proxy subscription
      security:
        - ManagementSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Subscription detail (url redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxySubscription"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "404":
          description: Subscription not found
    patch:
      operationId: patchApiV1ManagementProxySubscriptionsById
      tags: [Proxy Subscriptions]
      summary: Update a proxy subscription
      description: >-
        Partial update — only fields present in the body are changed
        (name/url/mode/ruleProviders/localCoreEndpoint/updateIntervalMinutes/enabled).
      security:
        - ManagementSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                url:
                  type: string
                mode:
                  type: string
                  enum: [global, rule]
                ruleProviders:
                  type: array
                  items:
                    type: string
                localCoreEndpoint:
                  type: string
                  nullable: true
                updateIntervalMinutes:
                  type: integer
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated subscription (url redacted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxySubscription"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "404":
          description: Subscription not found
    delete:
      operationId: deleteApiV1ManagementProxySubscriptionsById
      tags: [Proxy Subscriptions]
      summary: Delete a proxy subscription
      description: Removes the subscription record and unbinds/drops its synced proxy_registry rows.
      security:
        - ManagementSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "404":
          description: Subscription not found

  /api/v1/management/proxy-subscriptions/{id}/nodes:
    get:
      operationId: getApiV1ManagementProxySubscriptionsByIdNodes
      tags: [Proxy Subscriptions]
      summary: Get a subscription's last-parsed node summary
      description: >-
        Returns the last-parsed node list without re-fetching the (possibly slow)
        subscription URL.
      security:
        - ManagementSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Last-parsed node summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  mode:
                    type: string
                    enum: [global, rule]
                  enabled:
                    type: boolean
                  status:
                    type: string
                    enum: [ok, error, empty]
                  error:
                    type: string
                    nullable: true
                  lastFetchedAt:
                    type: string
                    format: date-time
                    nullable: true
                  nodes:
                    type: array
                    items: {}
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "404":
          description: Subscription not found

  /api/v1/management/proxy-subscriptions/{id}/refresh:
    post:
      operationId: postApiV1ManagementProxySubscriptionsByIdRefresh
      tags: [Proxy Subscriptions]
      summary: Refresh a proxy subscription
      description: >-
        Re-fetches and re-parses the subscription URL, syncs its nodes into
        `proxy_registry`, and (re)binds the pool.
      security:
        - ManagementSessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId:
                    type: string
                  nodes:
                    type: integer
                  needsCore:
                    type: integer
                  boundProxies:
                    type: integer
                  status:
                    type: string
                    enum: [ok, error, empty]
                  error:
                    type: string
                    nullable: true
                  applied:
                    type: boolean
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          $ref: "#/components/responses/ManagementInvalidToken"
        "404":
          description: Subscription not found

  # ─── Usage & Analytics ─────────────────────────────────────────

  /api/usage/analytics:
    get:
      operationId: getApiUsageAnalytics
      tags: [Usage]
      summary: Get usage analytics
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [1d, 7d, 30d, 90d, 180d, 365d, ytd, all]
            default: 30d
        - name: startDate
          in: query
          description: Inclusive custom range start; overrides the range start when present.
          schema: { type: string, format: date-time }
        - name: endDate
          in: query
          description: Inclusive custom range end.
          schema: { type: string, format: date-time }
        - name: apiKeyIds
          in: query
          description: Comma-separated API key IDs or historical key names to include.
          schema: { type: string }
        - name: includeFlatRateEstimates
          in: query
          description: Include token-price estimates for flat-rate subscription providers.
          schema: { type: boolean, default: false }
        - name: presets
          in: query
          description: Comma-separated preset ranges for additional cost summaries.
          schema: { type: string }
      responses:
        "200":
          description: Usage analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageAnalyticsResponse"
        "500":
          description: Analytics query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

  /api/usage/call-logs:
    get:
      operationId: getApiUsageCallLogs
      tags: [Usage]
      summary: Get call logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: status
          in: query
          description: Filter by `error`, `ok`, or a numeric HTTP status.
          schema: { type: string }
        - name: model
          in: query
          schema: { type: string }
        - name: provider
          in: query
          schema: { type: string }
        - name: account
          in: query
          schema: { type: string }
        - name: apiKey
          in: query
          schema: { type: string }
        - name: combo
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: correlationId
          in: query
          schema: { type: string }
        - name: excludeTests
          in: query
          description: Set to `1` to exclude connection-test probe rows.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: >-
            An array of active, recently completed in-memory, and persisted call-log summaries.
            The persisted portion is paginated by limit and offset; in-memory requests are merged
            into the same array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallLogListResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          description: Management credential is invalid or lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          description: Call-log query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"

  /api/usage/call-logs/{id}:
    get:
      operationId: getApiUsageCallLogsById
      tags: [Usage]
      summary: Get a specific call log
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Call log detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallLogDetailResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          description: Management credential is invalid or lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          description: Call log was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
        "500":
          description: Call-log detail query failed
          content:
