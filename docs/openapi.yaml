              type: { type: string }
              role: { type: string }
              status: { type: string }
              content:
                type: array
                items: { type: object, additionalProperties: true }
            additionalProperties: true
        error:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        incomplete_details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        usage:
          type: object
          additionalProperties: true
