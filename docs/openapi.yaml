          items:
            $ref: "#/components/schemas/PayloadMutationRule"
        override:
          type: array
          items:
            $ref: "#/components/schemas/PayloadMutationRule"
        filter:
          type: array
          items:
            $ref: "#/components/schemas/PayloadFilterRule"
        defaultRaw:
          type: array
          items:
            $ref: "#/components/schemas/PayloadMutationRule"
        default-raw:
          type: array
          items:
            $ref: "#/components/schemas/PayloadMutationRule"
      anyOf:
        - required: [default]
        - required: [override]
        - required: [filter]
        - required: [defaultRaw]
        - required: [default-raw]

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          example: gpt-4o
        messages:
          type: array
          items:
            type: object
            required: [role]
            properties:
              role:
                type: string
                description: >-
                  Message role. The proxy accepts any non-empty string; common values
                  include system, user, assistant, tool, function, and developer.
                example: user
              content:
                description: >-
                  Message content. May be a plain string, an array of content parts
                  for multimodal inputs (text, image, audio, etc.), or null when the
                  message only carries tool/function calls.
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      additionalProperties: true
                  - type: "null"
              name:
                type: string
              tool_call_id:
                type: string
              tool_calls:
                type: array
                items:
                  type: object
              function_call:
                type: object
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens:
          type: integer
        top_p:
          type: number
          minimum: 0
          maximum: 1
        n:
          type: integer
          minimum: 1
          default: 1
        stop:
          description: Up to 4 stop sequences (string or array of strings).
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 4
        frequency_penalty:
          type: number
          minimum: -2
          maximum: 2
        presence_penalty:
          type: number
          minimum: -2
          maximum: 2
        seed:
          type: integer
        logprobs:
          type: boolean
        top_logprobs:
          type: integer
          minimum: 0
          maximum: 20
        response_format:
          type: object
          description: Output format constraint (e.g. JSON mode or JSON Schema).
          properties:
            type:
              type: string
              example: json_object
        tools:
          type: array
          description: Tool definitions available to the model.
          items:
            type: object
        tool_choice:
          description: Controls which tool (if any) is invoked by the model.
          oneOf:
            - type: string
              example: auto
            - type: object
        parallel_tool_calls:
          type: boolean
          default: true
        reasoning_effort:
          type: string
          description: Provider-supported reasoning effort; accepted values vary by provider/model.
        reasoning:
          type: object
          description: Provider-specific reasoning configuration.
          additionalProperties: true
        max_completion_tokens:
          type: integer
          minimum: 1
        logit_bias:
          type: object
          additionalProperties:
            type: number
        stream_options:
          type: object
          additionalProperties: true
        service_tier:
          type: string
          example: auto
        user:
          type: string
          description: Stable end-user identifier for abuse monitoring.
      additionalProperties: true

    ChatCompletionResponse:
      type: object
      description: OpenAI-compatible non-streaming chat completion. Provider-specific extensions may also be returned.
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          description: Unix timestamp in seconds.
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    oneOf:
                      - type: string
                      - type: "null"
                  refusal:
                    type: [string, "null"]
                  tool_calls:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChatCompletionToolCall"
                  function_call:
                    type: object
                    properties:
                      name: { type: string }
                      arguments: { type: string }
                    additionalProperties: true
                additionalProperties: true
              logprobs:
                oneOf:
                  - type: object
                  - type: "null"
              finish_reason:
                type: [string, "null"]
            additionalProperties: true
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
            prompt_tokens_details:
              type: object
              additionalProperties: true
            completion_tokens_details:
              type: object
              additionalProperties: true
          additionalProperties: true
        system_fingerprint:
          type: string
        service_tier:
          type: string
      additionalProperties: true

    ChatCompletionToolCall:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: function }
        function:
          type: object
          properties:
            name: { type: string }
            arguments: { type: string }
          additionalProperties: true
      additionalProperties: true

    MessagesRequest:
      type: object
      required: [model, messages, max_tokens]
      properties:
        model:
          type: string
          example: claude-sonnet-4-5-20250514
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                oneOf:
                  - type: string
                  - type: array
                    minItems: 1
                    items:
                      type: object
                      description: Anthropic-compatible text, image, tool, or reasoning content block.
                      properties:
                        type: { type: string }
                      additionalProperties: true
        max_tokens:
          type: integer
          minimum: 1
        stream:
          type: boolean
          default: false
        system:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  type: { type: string, const: text }
                  text: { type: string }
                additionalProperties: true
        tools:
          type: array
          items:
            type: object
            required: [name, input_schema]
            properties:
              name: { type: string }
              description: { type: string }
              input_schema: { type: object, additionalProperties: true }
            additionalProperties: true
        tool_choice:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        stop_sequences:
          type: array
          items: { type: string }
        temperature:
          type: number
        top_p:
          type: number
        top_k:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        thinking:
          type: object
          additionalProperties: true
      additionalProperties: true

    MessagesResponse:
      type: object
      description: Anthropic-compatible message response. Additional provider fields are preserved when present.
