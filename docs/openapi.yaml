      tags: [Responses]
      summary: Create response (OpenAI Responses API)
      description: >-
        OpenAI Responses API endpoint. Authentication is required when REQUIRE_API_KEY
        is enabled; otherwise anonymous requests are accepted.
      security:
        - BearerAuth: []
        - ClientApiKeyAuth: []
        - GoogleApiKeyAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
      responses:
        "200":
          description: >-
            Response object or SSE stream. Non-streaming success responses carry
            the `X-OmniRoute-*` cost-telemetry headers (see
            `POST /api/v1/chat/completions`), including `X-OmniRoute-Request-Id`
            and `X-OmniRoute-Version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsesResponse"
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/embeddings:
    get:
      operationId: getApiV1Embeddings
      tags: [Embeddings]
      summary: List embedding models
      description: >-
        Returns the OpenAI-compatible model list filtered to embedding models.
        Authentication follows the configured model-catalog access policy: anonymous
        access is available only when the catalog policy permits it; otherwise a valid
        API key or authenticated dashboard session is required.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      responses:
        "200":
          description: Embedding model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
    post:
      operationId: postApiV1Embeddings
      tags: [Embeddings]
      summary: Create embeddings
      description: >-
        Creates embeddings using a configured provider or combo. Authentication is
        required when REQUIRE_API_KEY is enabled; otherwise anonymous requests are
        accepted.
      security:
        - BearerAuth: []
        - ClientApiKeyAuth: []
        - GoogleApiKeyAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, model]
              properties:
                input:
                  description: >-
                    Text, token IDs, or up to 32 canonical multimodal items. Structured media
                    input is accepted only when the resolved registry model advertises the
                    requested modalities. URL sources must be public HTTPS and are fetched
                    server-side into bounded inline media (redirect revalidation, timeout,
                    size limits, public DNS checks, and connection pinning) before provider
                    submission. Inline media is limited to 8 MiB decoded per item and 16 MiB
                    decoded per request. Canonical items are translated to provider-native
                    request shapes (Jina modality-keyed objects / Gemini embedContent parts)
                    rather than forwarded unchanged.
                  oneOf:
                    - type: string
                    - type: array
                      minItems: 1
                      items:
                        type: string
                    - type: array
                      minItems: 1
                      items:
                        type: integer
                        minimum: 0
                    - type: array
                      minItems: 1
                      items:
                        type: array
                        minItems: 1
                        items:
                          type: integer
                          minimum: 0
                    - type: array
                      minItems: 1
                      maxItems: 32
                      items:
                        $ref: "#/components/schemas/EmbeddingMultimodalItem"
                model:
                  type: string
                dimensions:
                  type: integer
                  minimum: 1
                encoding_format:
                  type: string
                  enum: [float, base64]
              additionalProperties: true
      responses:
        "200":
          description: >-
            Embedding vectors. Success responses carry the `X-OmniRoute-*`
            cost-telemetry headers (see `POST /api/v1/chat/completions`); media
            cost is computed per modality when pricing is available, otherwise
            `0` (fail-open).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"

  /api/v1/multimodal-embeddings:
    post:
      operationId: postApiV1MultimodalEmbeddings
      tags: [Embeddings]
      summary: Create embeddings (Jina multimodal-embeddings alias)
      description: >-
        Same handler as `POST /api/v1/embeddings`. Provided so Jina-compatible
        clients that call `/v1/multimodal-embeddings` do not receive HTTP 404
        `unknown_route`. Authentication is required when REQUIRE_API_KEY is enabled;
        otherwise anonymous requests are accepted.
      security:
        - BearerAuth: []
        - ClientApiKeyAuth: []
        - GoogleApiKeyAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, model]
              additionalProperties: true
      responses:
        "200":
          description: Embedding vectors (same contract as POST /api/v1/embeddings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: getApiV1MultimodalEmbeddings
      tags: [Embeddings]
      summary: List embedding models (Jina multimodal-embeddings alias)
      description: Authentication follows REQUIRE_API_KEY; anonymous requests are accepted when it is disabled.
      security:
        - BearerAuth: []
        - ManagementSessionAuth: []
        - {}
      responses:
        "200":
          description: Embedding model catalog (same as GET /api/v1/embeddings).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"

