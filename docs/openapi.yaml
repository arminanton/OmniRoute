                    example: list
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Model"
        "400":
          description: Unknown provider
        "401":
          description: Authentication is required but missing or invalid for the selected catalog path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"

