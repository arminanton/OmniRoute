  /api/logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getApiLogsById
      tags: [Logs]
      summary: Get live or persisted request details
      description: >-
        Returns in-flight request state first, then recently completed in-memory detail, then the
        persisted call-log artifact. A response can therefore be partial while a stream is active;
        the management pipeline payload is returned in its expanded shape. Conversation and tool
        display details may be absent when capture was disabled, omitted by a size/memory limit, or
        the artifact was removed.
      responses:
        "200":
          description: In-flight, in-memory completed, or persisted request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementLogDetailResponse"
        "400":
          description: Request ID is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
        "401":
          $ref: "#/components/responses/ManagementAuthenticationRequired"
        "403":
          description: Management credential is invalid or lacks the required scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Request log was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
        "500":
          description: Request detail could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StringErrorResponse"
  /api/logs/console:
    get:
      operationId: getApiLogsConsole
