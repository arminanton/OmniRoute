        promptTokens: { type: number, minimum: 0 }
        completionTokens: { type: number, minimum: 0 }
        cost: { type: number, minimum: 0 }
      additionalProperties: false

    UsageStatsResponse:
      type: object
      required:
        - totalRequests
        - totalPromptTokens
        - totalCompletionTokens
        - totalCost
        - byProvider
        - byModel
        - byAccount
        - byApiKey
        - last10Minutes
        - pending
        - activeRequests
      properties:
        totalRequests: { type: number, minimum: 0 }
        totalPromptTokens: { type: number, minimum: 0 }
        totalCompletionTokens: { type: number, minimum: 0 }
        totalCost: { type: number, minimum: 0 }
        byProvider:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/UsageBreakdown"
        byModel:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/UsageBreakdown"
        byAccount:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/UsageBreakdown"
        byApiKey:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/UsageBreakdown"
        last10Minutes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/UsageBucket"
        pending:
          type: object
          required: [byModel, byAccount]
          properties:
            byModel:
              type: object
              additionalProperties: { type: number, minimum: 0 }
            byAccount:
              type: object
              additionalProperties:
                type: object
                additionalProperties: { type: number, minimum: 0 }
          additionalProperties: false
        activeRequests:
          type: array
          items:
            type: object
            required: [model, provider, account, count]
            properties:
              model: { type: string }
              provider: { type: string }
              account: { type: string }
              count: { type: number, minimum: 0 }
            additionalProperties: false
      additionalProperties: false

    UsageBudgetConfig:
      type: object
      properties:
        dailyLimitUsd: { type: number, minimum: 0 }
        weeklyLimitUsd: { type: number, minimum: 0 }
        monthlyLimitUsd: { type: number, minimum: 0 }
        warningThreshold: { type: number, minimum: 0, maximum: 1 }
        resetInterval: { type: string, enum: [daily, weekly, monthly] }
        resetTime: { type: string, pattern: '^\\d{2}:\\d{2}$' }
        budgetResetAt: { type: [integer, "null"] }
        lastBudgetResetAt: { type: [integer, "null"] }
        warningEmittedAt: { type: [integer, "null"] }
        warningPeriodStart: { type: [integer, "null"] }
      additionalProperties: false

    UsageBudgetCheck:
      type: object
      required: [allowed, dailyUsed, dailyLimit, warningReached, remaining, periodUsed, activeLimitUsd]
      properties:
        allowed: { type: boolean }
        reason: { type: string }
        dailyUsed: { type: number, minimum: 0 }
        dailyLimit: { type: number, minimum: 0 }
        warningReached: { type: boolean }
        remaining: { type: number, minimum: 0 }
        periodUsed: { type: number, minimum: 0 }
        activeLimitUsd: { type: number, minimum: 0 }
        resetInterval: { type: [string, "null"], enum: [daily, weekly, monthly, null] }
        resetTime: { type: [string, "null"] }
        budgetResetAt: { type: [integer, "null"] }
        lastBudgetResetAt: { type: [integer, "null"] }
        periodStartAt: { type: [integer, "null"] }
      additionalProperties: false

    UsageBudgetStatusResponse:
      type: object
      required: [budgetCheck, dailyTotal, monthlyTotal, totalEntries, totalCostToday, totalCostMonth, totalCostPeriod, activeLimitUsd]
      properties:
        budgetCheck:
          $ref: "#/components/schemas/UsageBudgetCheck"
        dailyTotal: { type: number, minimum: 0 }
        monthlyTotal: { type: number, minimum: 0 }
        totalEntries: { type: integer, minimum: 0 }
        budget:
          oneOf:
            - $ref: "#/components/schemas/UsageBudgetConfig"
            - type: "null"
        totalCostToday: { type: number, minimum: 0 }
        totalCostMonth: { type: number, minimum: 0 }
        totalCostPeriod: { type: number, minimum: 0 }
        activeLimitUsd: { type: number, minimum: 0 }
        resetInterval: { type: [string, "null"], enum: [daily, weekly, monthly, null] }
        resetTime: { type: [string, "null"] }
        budgetResetAt: { type: [integer, "null"] }
        lastBudgetResetAt: { type: [integer, "null"] }
        periodStartAt: { type: [integer, "null"] }
        nextResetAt: { type: [integer, "null"] }
        dailyLimitUsd: { type: number, minimum: 0 }
        weeklyLimitUsd: { type: number, minimum: 0 }
        monthlyLimitUsd: { type: number, minimum: 0 }
        warningThreshold: { type: [number, "null"], minimum: 0, maximum: 1 }
      additionalProperties: true

    SetUsageBudgetRequest:
      type: object
      required: [apiKeyId]
      properties:
        apiKeyId: { type: string, minLength: 1 }
        dailyLimitUsd: { type: number, minimum: 0 }
        weeklyLimitUsd: { type: number, minimum: 0 }
        monthlyLimitUsd: { type: number, minimum: 0 }
        warningThreshold: { type: number, minimum: 0, maximum: 1 }
        resetInterval: { type: string, enum: [daily, weekly, monthly] }
        resetTime: { type: string, pattern: '^\\d{2}:\\d{2}$' }
      additionalProperties: true

    UsageBudgetMutationResponse:
      type: object
      required: [success, apiKeyId, budget]
      properties:
        success: { type: boolean, const: true }
        apiKeyId: { type: string }
        budget:
          $ref: "#/components/schemas/UsageBudgetConfig"
      additionalProperties: false

    StringErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
      additionalProperties: false

    ComboCreate:
      type: object
      required: [name, models]
      properties:
        name:
          type: string
        models:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: string
                description: "provider/model reference"
              - type: object
                description: "structured combo step (provider, model, weight, ...)"
                additionalProperties: true
        strategy:
          type: string
          enum:
            - priority
            - weighted
            - round-robin
            - context-relay
            - fill-first
            - p2c
            - random
            - least-used
            - cost-optimized
            - reset-aware
            - reset-window
            - headroom
            - strict-random
            - auto
            - lkgp
            - context-optimized
            - fusion
          default: priority

    ComboListResponse:
      type: object
      required: [combos, total]
      properties:
        combos:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              strategy: { type: string }
              models:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: object
                      additionalProperties: true
              computed_context_length: { type: integer, minimum: 0 }
            additionalProperties: true
        total: { type: integer, minimum: 0 }
      additionalProperties: false
