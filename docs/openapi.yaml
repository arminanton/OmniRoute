          type: object
          description: Sensitive credential values are stripped and extraApiKeys are masked.
          properties:
            tag: { type: string }
            extraApiKeys:
              type: array
              items:
                type: string
                description: Masked key preview with a stable index marker; never the raw API key.
          not:
