  /api/v1/audio/speech:
    post:
      operationId: postApiV1AudioSpeech
      tags: [Audio]
      summary: Generate speech audio
      description: >-
        Text-to-speech endpoint. Routes to configured TTS providers. Authentication
        is required when REQUIRE_API_KEY is enabled; otherwise anonymous requests
        are accepted.
      security:
        - BearerAuth: []
        - ClientApiKeyAuth: []
        - GoogleApiKeyAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                input:
                  type: string
                model:
                  type: string
                voice:
                  type: string
                response_format:
                  type: string
                  description: Provider-supported audio format (commonly mp3, wav, opus, ogg, or pcm).
                speed:
                  type: number
                  minimum: 0.25
                  maximum: 4
              additionalProperties: true
      responses:
        "200":
          description: >-
            Audio data. Success responses carry the `X-OmniRoute-*`
            cost-telemetry headers (see `POST /api/v1/chat/completions`); speech
            cost is computed per character when pricing is available, otherwise
            `0` (fail-open).
          content:
            audio/*:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }

  /api/v1/audio/transcriptions:
    post:
      operationId: postApiV1AudioTranscriptions
      tags: [Audio]
      summary: Transcribe audio
      description: >-
        Audio-to-text transcription endpoint. Authentication is required when
        REQUIRE_API_KEY is enabled; otherwise anonymous requests are accepted.
      security:
        - BearerAuth: []
        - ClientApiKeyAuth: []
        - GoogleApiKeyAuth: []
        - ManagementSessionAuth: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                response_format:
                  type: string
                  enum: [json, text, srt, verbose_json, vtt]
                language: { type: string }
                prompt: { type: string }
                temperature: { type: number, minimum: 0, maximum: 1 }
              additionalProperties: true
      responses:
        "200":
          description: >-
            Transcription result. Success responses carry the `X-OmniRoute-*`
            cost-telemetry headers (see `POST /api/v1/chat/completions`);
            transcription cost is computed per second when pricing is available,
            otherwise `0` (fail-open).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioTranscriptionResponse"
            text/plain:
              schema: { type: string }
            text/vtt:
              schema: { type: string }
            application/x-subrip:
              schema: { type: string }
            text/srt:
              schema: { type: string }

