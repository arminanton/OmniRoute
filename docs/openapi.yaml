      properties:
        id: { type: string }
        object: { type: string, const: response }
        created_at: { type: integer }
        status:
          type: string
          enum: [completed, failed, in_progress, cancelled, queued, incomplete]
        model: { type: string }
        output:
          type: array
          items:
            type: object
            description: Message, reasoning, function-call, or provider-specific output item.
            properties:
